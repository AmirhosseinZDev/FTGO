spring.application.name=api-gateway
server.port=8080

# JWT Configuration (shared with user-service)
app.jwt.secret=fBsWwVrv0BNVpGIRYAjCeXn8nPCp5nHNfMvQY+PI5H9NE37H6ForsPalQRZi01d7zmfLVxe35UIE1qxwWVZxLw==

# Service URLs
services.user-service.url=http://localhost:8081
services.order-service.url=http://localhost:8082
services.restaurant-service.url=http://localhost:8084
services.courier-service.url=http://localhost:8083

# Gateway Routes Configuration
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${services.user-service.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=${services.order-service.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[2].id=restaurant-service
spring.cloud.gateway.routes[2].uri=${services.restaurant-service.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/restaurants/**

spring.cloud.gateway.routes[3].id=courier-service
spring.cloud.gateway.routes[3].uri=${services.courier-service.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/couriers/**

# Authentication routes (public)
spring.cloud.gateway.routes[4].id=auth-login
spring.cloud.gateway.routes[4].uri=${services.user-service.url}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/login
spring.cloud.gateway.routes[4].predicates[1]=Method=POST

spring.cloud.gateway.routes[5].id=auth-register
spring.cloud.gateway.routes[5].uri=${services.user-service.url}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/auth/register
spring.cloud.gateway.routes[5].predicates[1]=Method=POST

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true